    </header>
    <main>
        <h3> Pithar dokan
        </h3>
        <form>
            <fieldset class="basic-info">
                <legend>Basic info</legend>
                <label for="name">Name:</label>
            <input type="text" name="" id="name">
            <label for="email">Email:</label>
            <input type="email" name="" id="email">
            </fieldset>
            <fieldset>
            <legend>Pitha information</legend>
            <input type="radio" name="pitha" id="chitoi">
            <label for="chitoi">Chitoi</label>
            <input type="radio" name="pitha" id="patishapta">
            <label for="patishapta">Patishapta</label>
            <input type="radio" name="pitha" id="puli">
            <label for="puli">Puli</label>
        </fieldset>
        <fieldset>
            <legend>Bhorta</legend>
            <input type="checkbox" name="bhorta" id="alu">
            <label for="alu">Alu</label>
            <input type="checkbox" name="bhorta" id="begun">
            <label for="begun">Begun</label>
            <input type="checkbox" name="bhorta" id="kumro">
            <label for="kumro">Kumro</label>

        </fieldset>
        <fieldset>
            <legend>Extra Information</legend>
            <textarea cols="30" rows="5" name="" id=""></textarea>
        </fieldset>
        <input type="submit" value="Submit">
        </form>
    </main>
    <footer>

    </footer>
