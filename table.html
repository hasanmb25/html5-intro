<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #834c4c;
        }
        tfoot td {
            padding-right: 120px;
            background-color: #ec89d0;
            text-align: right;
        }
        caption {
            caption-side: top;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <main>
        <h2>Friends</h2>
        <table>
            <caption>List of Friends</caption>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>City</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>John Doe</td>
                    <td>30</td>
                    <td>New York</td>
                </tr>
                <tr>
                    <td>Jane Smith</td>
                    <td>25</td>
                    <td>Los Angeles</td>
                </tr>
                <tr>
                    <td>Mike Johnson</td>
                    <td>35</td>
                    <td>Chicago</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">Total: 3</td>
                </tr>
            </tfoot>
        </table>
    </main>
    <section>
        <h2>Table info</h2>
        <ul>
            <li>Table : table</li>
            <li>thead : table head</li>
            <li>tbody : table body</li>
            <li>tr : table row</li>
            <li>th : table header</li>
            <li>td : table data</li>
            <li>tfoot : table footer</li>
        </ul>
    </section>
</body>
</html>
